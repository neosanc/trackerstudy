const today = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const localDateStr = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const fmtDate = (d) => new Date(d+"T12:00:00").toLocaleDateString("es-CL",{weekday:"long",day:"numeric",month:"long",year:"numeric"});

const mToHM = (m) => { const h=Math.floor(m/60),mn=m%60; return h>0?`${h}h${mn>0?` ${mn}m`:""}`:mn>0?`${mn}m`:"0m"; };
const getWeekDates = (off=0) => { const d=new Date();d.setDate(d.getDate()+off*7);const day=d.getDay();const mon=new Date(d);mon.setDate(d.getDate()-(day===0?6:day-1));return Array.from({length:7},(_,i)=>{const x=new Date(mon);x.setDate(mon.getDate()+i);return localDateStr(x);}); };
const getMonthDates = (y,m) => { const f=new Date(y,m,1),l=new Date(y,m+1,0),s=f.getDay()===0?6:f.getDay()-1; const days=[]; for(let i=-s;i<=l.getDate()-1+(6-(l.getDay()===0?6:l.getDay()-1));i++){const d=new Date(y,m,i+1);days.push(localDateStr(d));} return days; };
const getPriScore = (t) => { const d=daysUntil(t.dueDate); const u=d<=0?100:d<=1?90:d<=3?70:d<=7?40:10; return u+Math.min((t.estimatedHours||3)*5,30); };
const getPriLabel = (s) => s>=80?{text:"Urgente",color:"#D96A6A",bg:"rgba(217,106,106,0.1)"}:s>=60?{text:"Alta",color:"#E89840",bg:"rgba(232,152,64,0.1)"}:s>=30?{text:"Media",color:"#5B9BD5",bg:"rgba(91,155,213,0.1)"}:{text:"Baja",color:"#5BAF6A",bg:"rgba(91,175,106,0.1)"};

// Grade calculation helper: given target final grade, evaluations with weights and existing grades, 
// compute what's needed on remaining evals
const calcNeededGrades = (evals, targetGrade = 6.7) => {
  let earnedWeight = 0, earnedPoints = 0, remainWeight = 0;
  const remaining = [];
  evals.forEach(ev => {
    if (ev.grade != null && ev.grade !== "") {
      earnedWeight += ev.weight;
      earnedPoints += ev.grade * ev.weight;
    } else {
      remainWeight += ev.weight;
      remaining.push(ev);
    }
  });
  if (remainWeight === 0) {
    const final = earnedWeight > 0 ? earnedPoints / earnedWeight : 0;
    return { final: Math.round(final * 10) / 10, needed: null, possible: final, impossible: false };
  }
  const needed = (targetGrade * (earnedWeight + remainWeight) - earnedPoints) / remainWeight;
  const maxPossible = (earnedPoints + 7.0 * remainWeight) / (earnedWeight + remainWeight);
  const impossible = needed > 7.0;
  const currentFinal = earnedWeight > 0 ? earnedPoints / earnedWeight : null;
  return { needed: Math.round(needed * 10) / 10, possible: Math.round(maxPossible * 10) / 10, impossible, remaining, currentFinal: currentFinal ? Math.round(currentFinal * 10) / 10 : null };
};

// ==================== FOCUS MODE (LAVA LAMP) ====================
function FocusMode({timeLeft,totalTime,subject,isBreak,isRunning,sessionCount,onToggle,onExit}) {
  const canvasRef=useRef(null);const animRef=useRef(null);
  const mins=Math.floor(timeLeft/60),secs=timeLeft%60;
  const progress=1-timeLeft/(totalTime*60);
  const sc=SUBJECTS[subject]?.color||"#5B9BD5";
  const circ=2*Math.PI*140;

  useEffect(()=>{
    const canvas=canvasRef.current;if(!canvas)return;
    const ctx=canvas.getContext("2d");
    const w=canvas.width=window.innerWidth*2,h=canvas.height=window.innerHeight*2;
    canvas.style.width="100vw";canvas.style.height="100vh";
    let t=0;
    const R=parseInt(sc.slice(1,3),16),G=parseInt(sc.slice(3,5),16),B=parseInt(sc.slice(5,7),16);

    // Lava lamp blobs with metaball-like behavior
    const blobs = Array.from({length:8},(_,i)=>({
      x:Math.random()*w, y:Math.random()*h,
      vx:(Math.random()-0.5)*1.5, vy:(Math.random()-0.5)*1.5 + (i%2===0?0.3:-0.3),
      r:Math.min(w,h)*(0.08+Math.random()*0.12),
      phase:Math.random()*Math.PI*2,
      speed:0.3+Math.random()*0.4,
    }));

    const draw=()=>{
      t+=0.008;
      // Background gradient
      const bg=ctx.createLinearGradient(0,0,w*0.5,h);
      bg.addColorStop(0,`rgba(${Math.max(R-40,10)},${Math.max(G-40,10)},${Math.max(B-40,10)},1)`);
      bg.addColorStop(0.5,`rgba(${Math.max(R-60,5)},${Math.max(G-60,5)},${Math.max(B-60,5)},1)`);
      bg.addColorStop(1,`rgba(${Math.max(R-80,0)},${Math.max(G-80,0)},${Math.max(B-80,0)},1)`);
      ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);

      // Update & draw lava blobs
      blobs.forEach((b,i)=>{
        b.x+=b.vx+Math.sin(t*b.speed+b.phase)*2;
        b.y+=b.vy+Math.cos(t*b.speed*0.7+b.phase)*1.5;
        // Bounce off edges with softness
        if(b.x<-b.r)b.x=w+b.r;if(b.x>w+b.r)b.x=-b.r;
        if(b.y<-b.r*2){b.vy=Math.abs(b.vy)*0.8+0.3;b.y=-b.r*2;}
        if(b.y>h+b.r*2){b.vy=-Math.abs(b.vy)*0.8-0.3;b.y=h+b.r*2;}

        const pulseR=b.r*(1+0.2*Math.sin(t*b.speed*1.5+b.phase));
        const grad=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,pulseR);
        const alpha=0.15+0.08*Math.sin(t+i);
        grad.addColorStop(0,`rgba(${Math.min(R+80,255)},${Math.min(G+80,255)},${Math.min(B+80,255)},${alpha*1.2})`);
        grad.addColorStop(0.3,`rgba(${Math.min(R+40,255)},${Math.min(G+40,255)},${Math.min(B+40,255)},${alpha*0.8})`);
        grad.addColorStop(0.6,`rgba(${R},${G},${B},${alpha*0.4})`);
        grad.addColorStop(1,`rgba(${R},${G},${B},0)`);
        ctx.fillStyle=grad;
        ctx.beginPath();ctx.arc(b.x,b.y,pulseR,0,Math.PI*2);ctx.fill();
      });

      // Subtle overlay glow in center
      const cg=ctx.createRadialGradient(w/2,h/2,0,w/2,h/2,Math.min(w,h)*0.4);
      cg.addColorStop(0,`rgba(${Math.min(R+100,255)},${Math.min(G+100,255)},${Math.min(B+100,255)},0.04)`);
      cg.addColorStop(1,"rgba(0,0,0,0)");
      ctx.fillStyle=cg;ctx.fillRect(0,0,w,h);

      animRef.current=requestAnimationFrame(draw);
    };
    draw();
    return ()=>cancelAnimationFrame(animRef.current);
  },[sc]);

  return (
    <div style={{position:"fixed",inset:0,zIndex:99999,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
      <canvas ref={canvasRef} style={{position:"absolute",inset:0}} />
      <div style={{position:"relative",zIndex:1,display:"flex",flexDirection:"column",alignItems:"center"}}>
        <button onClick={onExit} style={{position:"absolute",top:-80,right:-60,...btnG({background:"rgba(255,255,255,0.15)",color:"rgba(255,255,255,0.7)",fontSize:12,padding:"8px 16px",borderRadius:12,border:"1px solid rgba(255,255,255,0.15)",backdropFilter:"blur(20px)"})}}>
          Salir
        </button>
        <div style={{fontSize:14,fontWeight:500,color:"rgba(255,255,255,0.5)",letterSpacing:3,textTransform:"uppercase",marginBottom:32}}>
          {isBreak?"Descanso":SUBJECTS[subject]?.name}
        </div>
        <div style={{position:"relative",width:320,height:320,marginBottom:40}}>
          <svg width="320" height="320" style={{transform:"rotate(-90deg)",filter:`drop-shadow(0 0 40px rgba(255,255,255,0.15))`}}>
            <defs><linearGradient id="fRing" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stopColor="rgba(255,255,255,0.9)" />
              <stop offset="50%" stopColor="rgba(255,255,255,0.5)" />
              <stop offset="100%" stopColor="rgba(255,255,255,0.2)" />
            </linearGradient></defs>
            <circle cx="160" cy="160" r="140" fill="none" stroke="rgba(255,255,255,0.08)" strokeWidth="14" />
            <circle cx="160" cy="160" r="140" fill="none" stroke="url(#fRing)" strokeWidth="14" strokeLinecap="round" strokeDasharray={circ} strokeDashoffset={circ*(1-progress)} style={{transition:"stroke-dashoffset 1s linear"}} />
          </svg>
          <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
            <div style={{fontSize:72,fontWeight:200,color:"rgba(255,255,255,0.9)",letterSpacing:-3,fontVariantNumeric:"tabular-nums",fontFamily:fontStack}}>
              {String(mins).padStart(2,"0")}:{String(secs).padStart(2,"0")}
            </div>
            <div style={{fontSize:13,color:"rgba(255,255,255,0.35)",marginTop:4}}>Sesión {sessionCount%4+1} / 4</div>
          </div>
        </div>
        <button onClick={onToggle} style={{width:64,height:64,borderRadius:32,border:"1px solid rgba(255,255,255,0.2)",cursor:"pointer",background:"rgba(255,255,255,0.1)",backdropFilter:"blur(20px)",color:"rgba(255,255,255,0.8)",fontSize:22,display:"flex",alignItems:"center",justifyContent:"center",transition:"all 0.3s",boxShadow:"0 8px 32px rgba(0,0,0,0.2)"}}>
          {isRunning?"❚❚":"▶"}
        </button>
      </div>
    </div>
  );
}

// ==================== POMODORO ====================
function PomodoroView({data,upd}) {
  const [subject,setSub]=useState("etica");
  const [mode,setMode]=useState(data.settings?.pomodoroMode||"25/5");
  const [running,setRun]=useState(false);
  const [brk,setBrk]=useState(false);
  const [sessCt,setSC]=useState(0);
  const [goalTask,setGoalTask]=useState(null);
  const [focusMode,setFM]=useState(false);
  const [showReflection,setShowRef]=useState(false);
  const [tick,setTick]=useState(0); // forces re-render

  // Time-based tracking: store when the timer started and how long it should run
  const endTimeRef=useRef(null); // Date.now() ms when timer should end
  const durationRef=useRef(0); // total duration in seconds for this phase
  const intervalRef=useRef(null);
  const stateRef=useRef({subject,mode,goalTask,brk,sessCt});
  stateRef.current={subject,mode,goalTask,brk,sessCt};

  const wt=mode==="25/5"?25:50, sb=mode==="25/5"?5:10, lb=mode==="25/5"?25:60;
  const totalT=brk?(sessCt%4===0&&sessCt>0?lb:sb):wt;
  const sc=SUBJECTS[subject]?.color||"#5B9BD5";
  const pendingTasks=(data.tasks||[]).filter(t=>!t.completed&&t.subject===subject);

  // Calculate timeLeft from endTimeRef
  const timeLeft = running && endTimeRef.current
    ? Math.max(0, Math.ceil((endTimeRef.current - Date.now()) / 1000))
    : endTimeRef.current ? Math.max(0, Math.ceil((endTimeRef.current - Date.now()) / 1000)) : totalT * 60;

  // Handle timer completion
  const handleComplete = useCallback(() => {
    const st = stateRef.current;
    const curWt = st.mode==="25/5"?25:50;
    const curSb = st.mode==="25/5"?5:10;
    const curLb = st.mode==="25/5"?25:60;
    setRun(false);

    if (!st.brk) {
      const nc = st.sessCt + 1;
      setSC(nc);
      const now = new Date();
      const stMin = now.getHours()*60 + now.getMinutes() - curWt;
      const session = {date:today(), subject:st.subject, minutes:curWt, timestamp:Date.now(), startHour:Math.floor(Math.max(0,stMin)/60), startMinute:Math.max(0,stMin)%60, taskId:st.goalTask||null};
      upd(d=>({...d, pomodoroSessions:[...(d.pomodoroSessions||[]), session]}));
      if (st.goalTask) {
        upd(d=>({...d, tasks:(d.tasks||[]).map(t=>t.id===st.goalTask?{...t,actualMinutes:(t.actualMinutes||0)+curWt}:t)}));
      }
      setShowRef(true);
      setBrk(true);
      // Set up next phase (break)
      const breakDur = (nc%4===0?curLb:curSb)*60;
      endTimeRef.current = Date.now() + breakDur * 1000;
      durationRef.current = breakDur;
    } else {
      setBrk(false);
      const workDur = curWt * 60;
      endTimeRef.current = Date.now() + workDur * 1000;
      durationRef.current = workDur;
    }
  }, [upd]);

  // Tick interval - just forces re-render, actual time comes from Date.now()
  useEffect(() => {
    if (running) {
      intervalRef.current = setInterval(() => {
        const remaining = endTimeRef.current ? endTimeRef.current - Date.now() : 0;
        if (remaining <= 0) {
          clearInterval(intervalRef.current);
          intervalRef.current = null;
          handleComplete();
        }
        setTick(t => t + 1); // force re-render to update display
      }, 250); // Check 4x/sec for snappy UI even after background
    } else {
      if (intervalRef.current) { clearInterval(intervalRef.current); intervalRef.current = null; }
    }
    return () => { if (intervalRef.current) { clearInterval(intervalRef.current); intervalRef.current = null; } };
  }, [running, handleComplete]);

  const toggle = () => {
    if (!running) {
      // Starting: set end time based on current timeLeft
      const currentLeft = endTimeRef.current ? Math.max(0, endTimeRef.current - Date.now()) : totalT * 60 * 1000;
      endTimeRef.current = Date.now() + currentLeft;
      durationRef.current = totalT * 60;
      setRun(true);
    } else {
      // Pausing: endTimeRef stays as-is, we'll use the remaining time when resuming
      setRun(false);
    }
  };

  const reset = () => {
    setRun(false);
    setBrk(false);
    endTimeRef.current = null;
    durationRef.current = wt * 60;
    setTick(t => t + 1);
  };

  const changeMode = (m) => {
    setMode(m);
    setRun(false);
    setBrk(false);
    endTimeRef.current = null;
    durationRef.current = (m==="25/5"?25:50) * 60;
    upd(d=>({...d, settings:{...d.settings, pomodoroMode:m}}));
    setTick(t => t + 1);
  };

  const displayTimeLeft = running ? timeLeft : (endTimeRef.current ? Math.max(0, Math.ceil((endTimeRef.current - Date.now()) / 1000)) : totalT * 60);
  const mins = Math.floor(displayTimeLeft / 60), secs = displayTimeLeft % 60;
  const prog = 1 - displayTimeLeft / (totalT * 60);
  const circ = 2 * Math.PI * 120;
  const todayS = (data.pomodoroSessions||[]).filter(s=>s.date===today());
  const todayM = todayS.reduce((a,s)=>a+s.minutes, 0);

  const handleReflection = (r) => {
    // Save reflection to last session
    upd(d=>{
      const sessions=[...(d.pomodoroSessions||[])];
      if(sessions.length>0){
        const last={...sessions[sessions.length-1],reflection:r.reflection,focused:r.focused};
        sessions[sessions.length-1]=last;
      }
      return {...d,pomodoroSessions:sessions};
    });
    setShowRef(false);
  };

  if(focusMode) return (<>
    <FocusMode timeLeft={displayTimeLeft} totalTime={totalT} subject={subject} isBreak={brk} isRunning={running} sessionCount={sessCt} onToggle={toggle} onExit={()=>setFM(false)} />
    {showReflection && <ReflectionModal subject={subject} onSubmit={handleReflection} onSkip={()=>setShowRef(false)} />}
  </>);

  return (
    <div>
      <SectionHeader title="Pomodoro" subtitle={todayM>0?`${mToHM(todayM)} estudiados hoy`:"Tiempo de enfocarse"} right={<button onClick={()=>setFM(true)} style={btnG({letterSpacing:0.5,fontWeight:500})}>Modo foco</button>} />
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:24}}>
        <Glass accent={sc} style={{display:"flex",flexDirection:"column",alignItems:"center",padding:40}}>
          <div style={{display:"flex",gap:6,marginBottom:28,background:"rgba(0,0,0,0.03)",borderRadius:14,padding:4}}>
            {["25/5","50/10"].map(m=>(
              <button key={m} onClick={()=>changeMode(m)} style={{padding:"8px 22px",borderRadius:11,border:"none",cursor:"pointer",background:mode===m?"rgba(255,255,255,0.9)":"transparent",boxShadow:mode===m?"0 2px 8px rgba(0,0,0,0.06)":"none",color:mode===m?sc:"#8892A4",fontSize:13,fontWeight:600,transition:"all 0.25s",fontFamily:fontStack}}>{m}</button>
            ))}
          </div>
          <div style={{position:"relative",width:260,height:260,marginBottom:28}}>
            <svg width="260" height="260" style={{transform:"rotate(-90deg)",filter:`drop-shadow(0 0 20px ${sc}18)`}}>
              <defs><linearGradient id="tg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stopColor={sc}/><stop offset="50%" stopColor={`${sc}BB`}/><stop offset="100%" stopColor={`${sc}55`}/></linearGradient></defs>
              <circle cx="130" cy="130" r="120" fill="none" stroke="rgba(0,0,0,0.03)" strokeWidth="12"/>
              <circle cx="130" cy="130" r="120" fill="none" stroke="url(#tg)" strokeWidth="12" strokeLinecap="round" strokeDasharray={circ} strokeDashoffset={circ*(1-prog)} style={{transition:"stroke-dashoffset 1s linear"}}/>
            </svg>
            <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
              <div style={{fontSize:13,fontWeight:500,color:brk?"#5BAF6A":`${sc}AA`,letterSpacing:2,textTransform:"uppercase",marginBottom:6}}>{brk?"Descanso":"Enfoque"}</div>
              <div style={{fontSize:52,fontWeight:200,color:"#1F2937",letterSpacing:-2,fontVariantNumeric:"tabular-nums"}}>{String(mins).padStart(2,"0")}:{String(secs).padStart(2,"0")}</div>
              <div style={{fontSize:12,color:"#B0B8C8",marginTop:6}}>Sesión {sessCt%4+1} / 4</div>
            </div>
          </div>
          <div style={{display:"flex",gap:10}}>
            <button onClick={toggle} style={btnP(sc)}>{running?"Pausar":"Iniciar"}</button>
            <button onClick={reset} style={btnG()}>Reset</button>
          </div>
        </Glass>

        <div style={{display:"flex",flexDirection:"column",gap:16}}>
          <Glass>
            <div style={lbl}>Asignatura</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
              {Object.entries(SUBJECTS).map(([k,s])=>(
                <button key={k} onClick={()=>{setSub(k);setGoalTask(null);}} style={{padding:"8px 14px",borderRadius:12,border:subject===k?`1.5px solid ${s.color}60`:"1.5px solid transparent",cursor:"pointer",background:subject===k?`${s.color}12`:"rgba(0,0,0,0.02)",fontSize:12,fontWeight:subject===k?600:400,color:subject===k?s.color:"#8892A4",transition:"all 0.25s",fontFamily:fontStack}}>{s.name}</button>
              ))}
            </div>
          </Glass>

          {/* Goal from pending tasks */}
          <Glass accent={sc}>
            <div style={lbl}>Objetivo (tarea pendiente)</div>
            {pendingTasks.length===0 ? (
              <p style={{fontSize:13,color:"#B0B8C8"}}>No hay tareas pendientes en esta asignatura</p>
            ) : (
              <div style={{display:"flex",flexDirection:"column",gap:6}}>
                {pendingTasks.map(t=>(
                  <button key={t.id} onClick={()=>setGoalTask(goalTask===t.id?null:t.id)} style={{
                    display:"flex",alignItems:"center",gap:10,padding:"10px 14px",borderRadius:12,cursor:"pointer",textAlign:"left",
                    border:goalTask===t.id?`2px solid ${sc}`:"2px solid rgba(0,0,0,0.03)",
                    background:goalTask===t.id?`${sc}08`:"rgba(0,0,0,0.01)",
                    fontFamily:fontStack,fontSize:13,color:goalTask===t.id?sc:"#4A5568",fontWeight:goalTask===t.id?600:400,transition:"all 0.2s",width:"100%"
                  }}>
                    <div style={{width:8,height:8,borderRadius:4,background:goalTask===t.id?sc:"#C0C8D8",flexShrink:0}} />
                    <span style={{flex:1}}>{t.name}</span>
                    {t.dueDate && <span style={{fontSize:11,color:"#B0B8C8"}}>{daysUntil(t.dueDate)}d</span>}
                  </button>
                ))}
              </div>
            )}
          </Glass>

          <Glass>
            <div style={lbl}>Sesiones de hoy</div>
            {todayS.length===0?<p style={{fontSize:13,color:"#B0B8C8"}}>Sin sesiones aún</p>:(
              <div style={{display:"flex",flexDirection:"column",gap:6}}>
                {todayS.map((s,i)=>(
                  <div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 12px",borderRadius:12,background:SUBJECTS[s.subject]?.lightColor}}>
                    <div style={{width:8,height:8,borderRadius:4,background:SUBJECTS[s.subject]?.color}} />
                    <span style={{fontSize:13,color:SUBJECTS[s.subject]?.color,fontWeight:500,flex:1}}>{SUBJECTS[s.subject]?.name}</span>
                    <span style={{fontSize:11,color:s.focused==="focused"?"#5BAF6A":s.focused==="distracted"?"#E89840":"#B0B8C8"}}>{s.focused==="focused"?"Enfocado":s.focused==="distracted"?"Distraído":""}</span>
                    <span style={{fontSize:12,color:"#B0B8C8"}}>{s.minutes}min</span>
                  </div>
                ))}
              </div>
            )}
          </Glass>
        </div>
      </div>
      {showReflection && <ReflectionModal subject={subject} onSubmit={handleReflection} onSkip={()=>setShowRef(false)} />}
    </div>
  );
}

// ==================== SCHEDULE ====================
function ScheduleView({data,upd}) {
  const [ed,setEd]=useState(null);const [ef,setEf]=useState({});
  const sch=data.schedule||DEFAULT_SCHEDULE;const hours=Array.from({length:12},(_,i)=>i+7);
  const save=()=>{if(!ed)return;const ns={...sch};ns[ed.day]=[...(ns[ed.day]||[])];if(ed.idx===-1)ns[ed.day].push(ef);else ns[ed.day][ed.idx]=ef;upd(d=>({...d,schedule:ns}));setEd(null);};
  const del=()=>{if(!ed||ed.idx===-1)return;const ns={...sch};ns[ed.day]=sch[ed.day].filter((_,i)=>i!==ed.idx);upd(d=>({...d,schedule:ns}));setEd(null);};

  return (
    <div>
      <SectionHeader title="Horario Semanal" subtitle="Semestre Otoño 2026" />
      <Glass>
        <div style={{display:"grid",gridTemplateColumns:"56px repeat(5,1fr)",gap:0}}>
          <div/>
          {DAYS.map(d=>(
            <div key={d} style={{textAlign:"center",padding:"12px 4px 16px",fontWeight:600,color:"#5B9BD5",fontSize:13,borderBottom:"1px solid rgba(0,0,0,0.04)"}}>
              {d}
              <button onClick={()=>{setEd({day:d,idx:-1});setEf({subject:"etica",start:"09:00",end:"10:00",room:"",professor:""});}} style={{display:"block",margin:"6px auto 0",padding:"3px 10px",borderRadius:8,border:"1px solid rgba(91,155,213,0.15)",background:"transparent",cursor:"pointer",fontSize:11,color:"#5B9BD5",fontFamily:fontStack}}>+ Clase</button>
            </div>
          ))}
          {hours.map(h=>(<React.Fragment key={h}>
            <div style={{padding:"14px 6px 14px 0",fontSize:11,color:"#B0B8C8",textAlign:"right",borderTop:"1px solid rgba(0,0,0,0.02)",fontVariantNumeric:"tabular-nums"}}>{String(h).padStart(2,"0")}:00</div>
            {DAYS.map(d=>{
              const cls=(sch[d]||[]).filter(c=>parseInt(c.start)===h);
              return <div key={`${d}${h}`} style={{borderTop:"1px solid rgba(0,0,0,0.02)",padding:3,minHeight:44}}>
                {cls.map((c,ci)=>{const s=SUBJECTS[c.subject];return(
                  <div key={ci} onClick={()=>{setEd({day:d,idx:sch[d].indexOf(c)});setEf({...c});}} style={{background:`linear-gradient(135deg,${s?.color}10,${s?.color}06)`,border:`1px solid ${s?.color}20`,borderRadius:12,padding:"8px 10px",cursor:"pointer",marginBottom:3}}>
                    <div style={{fontSize:12,fontWeight:600,color:s?.color}}>{s?.name}</div>
                    <div style={{fontSize:10.5,color:"#8892A4",marginTop:2}}>{c.start} – {c.end}</div>
                    <div style={{fontSize:10.5,color:"#B0B8C8"}}>{c.room} · {c.professor}</div>
                  </div>
                );})}
              </div>;
            })}
          </React.Fragment>))}
        </div>
      </Glass>
      {ed&&<Modal title={ed.idx===-1?`Nueva clase — ${ed.day}`:`Editar — ${ed.day}`} onClose={()=>setEd(null)}>
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          <select value={ef.subject||""} onChange={e=>setEf({...ef,subject:e.target.value})} style={inp}>{Object.entries(SUBJECTS).map(([k,s])=><option key={k} value={k}>{s.name}</option>)}</select>
          <div style={{display:"flex",gap:8}}><input type="time" value={ef.start||""} onChange={e=>setEf({...ef,start:e.target.value})} style={inp}/><input type="time" value={ef.end||""} onChange={e=>setEf({...ef,end:e.target.value})} style={inp}/></div>
          <input placeholder="Sala" value={ef.room||""} onChange={e=>setEf({...ef,room:e.target.value})} style={inp}/>
          <input placeholder="Profesor/a" value={ef.professor||""} onChange={e=>setEf({...ef,professor:e.target.value})} style={inp}/>
          <div style={{display:"flex",gap:8,marginTop:8}}>
            <button onClick={save} style={{...btnP(),flex:1}}>Guardar</button>
            {ed.idx!==-1&&<button onClick={del} style={{...btnP("#D96A6A"),padding:"12px 20px"}}>Eliminar</button>}
            <button onClick={()=>setEd(null)} style={btnG()}>Cancelar</button>
          </div>
        </div>
      </Modal>}
    </div>
  );
}

// ==================== CALENDAR ====================
function CalendarView({data,upd}) {

  });

  const add=()=>{if(!ef.name||!ef.date)return;upd(d=>({...d,evaluations:[...(d.evaluations||[]),{...ef,id:Date.now()}]}));setShow(false);setEf({subject:"etica",type:"Solemne",name:"",date:""});};

  return (

              <div style={{fontSize:12,fontWeight:it?700:400,color:it?"#5B9BD5":"#4A5568",marginBottom:3}}>{d.getDate()}</div>
              {sm>0&&<div style={{fontSize:9.5,color:"#5B9BD5",background:"rgba(91,155,213,0.08)",borderRadius:4,padding:"1px 4px",display:"inline-block",marginBottom:2}}>{mToHM(sm)}</div>}
              {de.map((ev,ei)=><div key={ei} style={{fontSize:9.5,padding:"1px 4px",borderRadius:4,marginBottom:1,background:SUBJECTS[ev.subject]?.lightColor,color:SUBJECTS[ev.subject]?.color,fontWeight:500,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{ev.name}</div>)}

            </div>;
          })}
        </div>
      </Glass>
      {/* Upcoming */}
      <Glass style={{marginTop:16}}>
        <div style={lbl}>Próximas evaluaciones</div>
        {evs.filter(e=>e.date>=today()).sort((a,b)=>a.date.localeCompare(b.date)).length===0?<p style={{fontSize:13,color:"#B0B8C8"}}>Ninguna</p>:
        evs.filter(e=>e.date>=today()).sort((a,b)=>a.date.localeCompare(b.date)).map(ev=>{
          const d=daysUntil(ev.date);const s=SUBJECTS[ev.subject];
          return <div key={ev.id} style={{display:"flex",alignItems:"center",gap:12,padding:"12px 14px",borderRadius:14,background:`${s?.color}06`,border:`1px solid ${s?.color}12`,marginBottom:8}}>

// ==================== TIME TRACKER ====================
function TimeTracker({sessions,schedule,selectedDate}) {
  const hours=Array.from({length:20},(_,i)=>i+5);
  const blocks=sessions.map(s=>{
    const sh=s.startHour??Math.floor((s.timestamp?new Date(s.timestamp).getHours()*60+new Date(s.timestamp).getMinutes()-s.minutes:480)/60);
    const sm=s.startMinute??0;
    return {subject:s.subject,startH:sh,startM:sm,duration:s.minutes,type:"study"};
  });
  const dow=new Date(selectedDate+"T12:00:00").getDay();
  const dn={1:"Lunes",2:"Martes",3:"Miércoles",4:"Jueves",5:"Viernes"}[dow];
  if(dn&&schedule?.[dn]) schedule[dn].forEach(c=>{const[sh,sm]=c.start.split(":").map(Number);const[eh,em]=c.end.split(":").map(Number);blocks.push({subject:c.subject,startH:sh,startM:sm,duration:(eh*60+em)-(sh*60+sm),type:"class"});});
  const totalMins=hours.length*60;
  return (
    <div style={{position:"relative"}}>
      <div style={{position:"relative",height:hours.length*36}}>
        {hours.map((h,i)=><div key={h} style={{position:"absolute",top:i*36,left:0,right:0,height:36,display:"flex",alignItems:"flex-start"}}><div style={{width:36,fontSize:10,color:"#B0B8C8",textAlign:"right",paddingRight:8,fontVariantNumeric:"tabular-nums",flexShrink:0}}>{String(h).padStart(2,"0")}</div><div style={{flex:1,borderTop:"1px solid rgba(0,0,0,0.03)",height:"100%"}} /></div>)}
        {blocks.map((b,i)=>{const s=SUBJECTS[b.subject];const top=((b.startH-5)*60+b.startM)/totalMins*hours.length*36;const height=Math.max(b.duration/totalMins*hours.length*36,14);const ic=b.type==="class";
          return <div key={i} style={{position:"absolute",top:Math.max(0,top),left:44,right:8,height,background:ic?`repeating-linear-gradient(135deg,${s?.color}10,${s?.color}10 4px,${s?.color}06 4px,${s?.color}06 8px)`:`linear-gradient(135deg,${s?.color}25,${s?.color}15)`,border:`1px solid ${s?.color}${ic?"15":"30"}`,borderRadius:8,padding:"2px 8px",display:"flex",alignItems:"center",gap:6,overflow:"hidden"}}>
            <div style={{width:4,height:"60%",borderRadius:2,background:s?.color,flexShrink:0,opacity:ic?0.5:1}} />
            <div style={{fontSize:10,fontWeight:600,color:s?.color,whiteSpace:"nowrap",opacity:ic?0.6:1}}>{s?.name}{ic?" (clase)":""}</div>
          </div>;
        })}
        {selectedDate===today()&&(()=>{const now=new Date();const cm=(now.getHours()-5)*60+now.getMinutes();const top=cm/totalMins*hours.length*36;if(top<0||top>hours.length*36)return null;return <div style={{position:"absolute",top,left:36,right:0,height:2,background:"#D96A6A",zIndex:2,borderRadius:1}}><div style={{position:"absolute",left:-3,top:-3,width:8,height:8,borderRadius:4,background:"#D96A6A"}} /></div>;})()}
      </div>
    </div>
  );
}

            <div style={lbl}>Proyección</div>
            {evs.length===0?<p style={{fontSize:13,color:"#B0B8C8"}}>Agrega evaluaciones para ver la proyección</p>:(
              <div>
                {calc.currentFinal!=null&&<div style={{marginBottom:12}}><span style={{fontSize:12,color:"#8892A4"}}>Promedio actual: </span><span style={{fontSize:20,fontWeight:300,color:sc}}>{calc.currentFinal}</span></div>}
                {calc.needed!=null?(
                  calc.impossible?(
                    <div style={{padding:14,borderRadius:12,background:"rgba(217,106,106,0.06)",border:"1px solid rgba(217,106,106,0.15)"}}>
                      <div style={{fontSize:13,fontWeight:600,color:"#D96A6A",marginBottom:4}}>Nota máxima alcanzable: {calc.possible}</div>
                      <p style={{fontSize:12,color:"#8892A4",margin:0}}>Con nota 7.0 en todas las evaluaciones restantes, lo máximo posible es {calc.possible}</p>
                    </div>
                  ):(
                    <div style={{padding:14,borderRadius:12,background:`${sc}06`,border:`1px solid ${sc}15`}}>
                      <div style={{fontSize:13,fontWeight:600,color:sc,marginBottom:4}}>Necesitas promedio: {calc.needed}</div>
                      <p style={{fontSize:12,color:"#8892A4",margin:0}}>En las evaluaciones restantes para lograr {subjGrades.targetGrade}</p>
                    </div>
                  )
                ):(
                  <div style={{padding:14,borderRadius:12,background:"rgba(91,175,106,0.06)"}}>
                    <div style={{fontSize:13,fontWeight:600,color:"#5BAF6A"}}>Nota final: {calc.final}</div>
                  </div>
                )}
                {/* Per-evaluation recommendation spread */}
                {calc.remaining&&calc.remaining.length>0&&!calc.impossible&&(()=>{
                  const target=calc.needed;
                  const remaining=evs.filter(e=>e.grade==null||e.grade==="").map(e=>({...e,weight:Number(e.weight||0)}));
                  const totalRemW=remaining.reduce((a,e)=>a+e.weight,0);
                  // Distribute: weight each eval proportionally but suggest slightly higher on heavier evals
                  const suggestions=remaining.map(e=>{
                    const base=target;
                    // Slight adjustment: heavier evals get slightly lower target (easier to hit), lighter ones slightly higher
                    const weightRatio=totalRemW>0?e.weight/totalRemW:1/remaining.length;
                    const adjusted=Math.min(7.0,Math.max(1.0,base+(0.5-weightRatio)*0.3));
                    return {...e,suggested:Math.round(adjusted*10)/10};
                  });
                  // Verify: recalculate to make sure suggestions actually hit the target
                  const earnedW=evs.filter(e=>e.grade!=null&&e.grade!=="").reduce((a,e)=>a+Number(e.weight||0),0);
                  const earnedP=evs.filter(e=>e.grade!=null&&e.grade!=="").reduce((a,e)=>a+Number(e.grade)*Number(e.weight||0),0);
                  return (
                    <div style={{marginTop:12}}>
                      <div style={{fontSize:11,fontWeight:600,color:"#A0A8B8",marginBottom:8,textTransform:"uppercase",letterSpacing:1}}>Sugerencia por evaluación</div>
                      <div style={{display:"flex",flexDirection:"column",gap:6}}>
                        {suggestions.map(s=>(
                          <div key={s.id} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 10px",borderRadius:10,background:"rgba(0,0,0,0.015)"}}>
                            <div style={{flex:1}}>
                              <div style={{fontSize:12,fontWeight:500,color:"#1F2937"}}>{s.name}</div>
                              <div style={{fontSize:10,color:"#A0A8B8"}}>{s.weight}% · {s.date?fmtDate(s.date):"Sin fecha"}</div>
                            </div>
                            <div style={{fontSize:16,fontWeight:600,color:s.suggested<=5.0?"#D96A6A":s.suggested<=6.0?"#E89840":sc}}>{s.suggested}</div>
                          </div>
                        ))}
                      </div>
                    </div>
                  );
                })()}
              </div>
            )}
          </Glass>
        </div>
      </div>
    </div>
  );
}

// ==================== STATS ====================
function StatsView({data}) {
  const [wo,setWO]=useState(0);
  const sessions=data.pomodoroSessions||[];
  const wd=getWeekDates(wo);
  const weekData=wd.map(date=>{const ds=sessions.filter(s=>s.date===date);const bs={};ds.forEach(s=>{bs[s.subject]=(bs[s.subject]||0)+s.minutes;});return{date,total:ds.reduce((a,s)=>a+s.minutes,0),bySubject:bs};});
  const maxW=Math.max(...weekData.map(d=>d.total),60);
  const now=new Date();const monthDates=getMonthDates(now.getFullYear(),now.getMonth());
  const totalMin=sessions.reduce((a,s)=>a+s.minutes,0);
  const uniqueDays=new Set(sessions.map(s=>s.date)).size;
  const avgPD=uniqueDays>0?Math.round(totalMin/uniqueDays):0;
  const streak=(()=>{let c=0;const d=new Date();while(sessions.some(s=>s.date===localDateStr(d))){c++;d.setDate(d.getDate()-1);}return c;})();
  const subjTotals={};sessions.forEach(s=>{subjTotals[s.subject]=(subjTotals[s.subject]||0)+s.minutes;});

  // Focus stats
  const focusedCount=sessions.filter(s=>s.focused==="focused").length;
  const distractedCount=sessions.filter(s=>s.focused==="distracted").length;
  const totalRated=focusedCount+distractedCount;
  const focusPct=totalRated>0?Math.round(focusedCount/totalRated*100):0;

  // Mood monthly stats
  const monthLogs=Object.entries(data.dailyLogs||{}).filter(([d])=>{const dt=new Date(d+"T12:00:00");return dt.getMonth()===now.getMonth()&&dt.getFullYear()===now.getFullYear();});
  const moodCounts={};monthLogs.forEach(([,l])=>{if(l.mood)moodCounts[l.mood]=(moodCounts[l.mood]||0)+1;});

  return (
    <div>
      <SectionHeader title="Estadísticas" subtitle="Tu progreso de estudio" />
      <div style={{display:"grid",gridTemplateColumns:"repeat(5, 1fr)",gap:12,marginBottom:24}}>
        {[
          {label:"Total",value:mToHM(totalMin),color:"#5B9BD5"},
          {label:"Días activos",value:uniqueDays,color:"#5BAF6A"},
          {label:"Promedio / día",value:mToHM(avgPD),color:"#E89840"},
          {label:"Racha",value:`${streak} días`,color:"#D96A6A"},
          {label:"Enfoque",value:`${focusPct}%`,color:"#8B6AD9"},
        ].map(s=>(
          <Glass key={s.label} accent={s.color} style={{textAlign:"center",padding:18}}>
            <div style={{fontSize:26,fontWeight:200,color:s.color,letterSpacing:-1}}>{s.value}</div>
            <div style={{fontSize:10,color:"#A0A8B8",marginTop:6,letterSpacing:0.5,textTransform:"uppercase"}}>{s.label}</div>
          </Glass>
        ))}
      </div>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
        {/* Weekly chart */}
        <Glass>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}>
            <div style={lbl}>Semanal</div>
            <div style={{display:"flex",gap:6,alignItems:"center"}}>
              <button onClick={()=>setWO(prev=>prev-1)} style={{border:"none",background:"none",cursor:"pointer",color:"#5B9BD5",fontSize:16,padding:"4px 8px"}}>‹</button>
              <button onClick={()=>setWO(0)} style={btnG({padding:"2px 8px",fontSize:10})}>Hoy</button>
              <button onClick={()=>setWO(prev=>prev+1)} style={{border:"none",background:"none",cursor:"pointer",color:"#5B9BD5",fontSize:16,padding:"4px 8px"}}>›</button>
            </div>
          </div>
          <div style={{display:"flex",gap:8,height:170,alignItems:"flex-end"}}>
            {weekData.map((day,i)=>{
              const dn=new Date(day.date+"T12:00:00").toLocaleDateString("es-CL",{weekday:"narrow"});
              const isT=day.date===today();
              const barHeight=maxW>0&&day.total>0?Math.max(Math.round((day.total/maxW)*140),8):4;
              return (
                <div key={day.date} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"flex-end"}}>
                  <span style={{fontSize:10,color:"#B0B8C8",fontVariantNumeric:"tabular-nums",marginBottom:4,height:16}}>{day.total>0?mToHM(day.total):""}</span>
                  <div style={{width:"80%",height:barHeight,borderRadius:8,overflow:"hidden",display:"flex",flexDirection:"column-reverse"}}>
                    {Object.entries(day.bySubject).map(([subj,mins])=>(
                      <div key={subj} style={{height:day.total>0?`${(mins/day.total)*100}%`:"0%",background:SUBJECTS[subj]?.gradient||SUBJECTS[subj]?.color,minHeight:mins>0?3:0}} />
                    ))}
                    {day.total===0&&<div style={{height:"100%",background:"rgba(0,0,0,0.03)"}} />}
                  </div>
                  <span style={{fontSize:11,fontWeight:isT?700:400,color:isT?"#5B9BD5":"#8892A4",marginTop:4}}>{dn}</span>
                </div>
              );
            })}
          </div>
          <div style={{display:"flex",flexWrap:"wrap",gap:6,marginTop:12,paddingTop:10,borderTop:"1px solid rgba(0,0,0,0.04)"}}>
            {Object.entries(SUBJECTS).map(([k,s])=><div key={k} style={{display:"flex",alignItems:"center",gap:4,fontSize:10,color:"#8892A4"}}><div style={{width:8,height:8,borderRadius:3,background:s.color}} />{s.name}</div>)}
          </div>
        </Glass>

        {/* Heatmap */}
        <Glass>
          <div style={lbl}>{now.toLocaleDateString("es-CL",{month:"long"})}</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4}}>
            {["L","M","X","J","V","S","D"].map(d=><div key={d} style={{textAlign:"center",fontSize:10,fontWeight:600,color:"#C0C8D8",padding:3}}>{d}</div>)}
            {monthDates.map((date,i)=>{const d=new Date(date+"T12:00:00");const ic=d.getMonth()===now.getMonth();const mins=sessions.filter(s=>s.date===date).reduce((a,s)=>a+s.minutes,0);const int=Math.min(mins/240,1);const isT=date===today();
              return <div key={i} style={{aspectRatio:"1",borderRadius:7,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:isT?700:400,background:!ic?"transparent":mins>0?`rgba(91,155,213,${0.08+int*0.65})`:"rgba(0,0,0,0.015)",color:!ic?"transparent":mins>0&&int>0.4?"#fff":isT?"#5B9BD5":"#8892A4",border:isT?"1.5px solid #5B9BD5":"none"}}>{ic?d.getDate():""}</div>;
            })}
          </div>
        </Glass>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,marginTop:16}}>
        {/* Focus vs distracted */}
        <Glass>
          <div style={lbl}>Enfoque vs Distracción</div>
          {totalRated===0?<p style={{fontSize:13,color:"#B0B8C8"}}>Completa reflexiones post-pomodoro para ver datos</p>:(
            <div>
              <div style={{display:"flex",height:24,borderRadius:12,overflow:"hidden",marginBottom:12}}>
                <div style={{width:`${focusPct}%`,background:"linear-gradient(135deg,#5BAF6A,#7DD08E)",transition:"width 0.5s"}} />
                <div style={{width:`${100-focusPct}%`,background:"linear-gradient(135deg,#E89840,#F0B860)",transition:"width 0.5s"}} />
              </div>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:13}}>
                <span style={{color:"#5BAF6A",fontWeight:600}}>Enfocado: {focusedCount} ({focusPct}%)</span>
                <span style={{color:"#E89840",fontWeight:600}}>Distraído: {distractedCount} ({100-focusPct}%)</span>
              </div>
            </div>
          )}
        </Glass>

        {/* Monthly mood */}
        <Glass>
          <div style={lbl}>Ánimo del mes</div>
          {Object.keys(moodCounts).length===0?<p style={{fontSize:13,color:"#B0B8C8"}}>Registra tu ánimo diario para ver datos</p>:(
            <div style={{display:"flex",gap:8,alignItems:"flex-end",height:100}}>
              {MOODS.map(m=>{const ct=moodCounts[m.grade]||0;const maxCt=Math.max(...Object.values(moodCounts),1);
                return <div key={m.grade} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
                  {ct>0&&<span style={{fontSize:10,color:"#8892A4"}}>{ct}</span>}
                  <div style={{width:"100%",height:Math.max(ct/maxCt*60,ct>0?8:2),borderRadius:6,background:ct>0?m.color:"rgba(0,0,0,0.03)",transition:"height 0.5s"}} />
                  <span style={{fontSize:14}}>{m.emoji}</span>
                </div>;
              })}
            </div>
          )}
        </Glass>
      </div>

      {/* Subject breakdown */}
      <Glass style={{marginTop:16}}>
        <div style={lbl}>Por asignatura</div>
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          {Object.entries(subjTotals).sort((a,b)=>b[1]-a[1]).map(([subj,mins])=>{const s=SUBJECTS[subj];const pct=totalMin>0?(mins/totalMin)*100:0;
            return <div key={subj}><div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}><span style={{fontSize:13,fontWeight:500,color:"#1F2937"}}>{s?.name}</span><span style={{fontSize:12,color:"#8892A4"}}>{mToHM(mins)} ({Math.round(pct)}%)</span></div><div style={{height:8,borderRadius:4,background:"rgba(0,0,0,0.03)",overflow:"hidden"}}><div style={{height:"100%",width:`${pct}%`,background:s?.gradient||s?.color,borderRadius:4,transition:"width 0.5s"}} /></div></div>;
          })}
          {Object.keys(subjTotals).length===0&&<p style={{fontSize:13,color:"#B0B8C8"}}>Completa pomodoros para ver estadísticas</p>}
        </div>
      </Glass>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(StudyTracker));
</script>
